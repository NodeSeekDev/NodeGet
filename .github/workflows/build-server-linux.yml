name: build-server-linux

# 可复用的 Linux server 构建流程，从 build.yml 中单独拆出。
# 拆出来的原因：Docker 镜像只用到这里产出的 Linux musl server 二进制，
# 调用方可以让 Docker 发布只依赖这一步，不必等 agent、Windows、macOS 的构建。
# 其余平台见 build.yml；target 列表见 .github/build-matrix.json 的 server_linux。

on:
  workflow_call:
    inputs:
      nightly:
        description: "只构建 build-matrix.json 中标记了 nightly 的 target"
        required: false
        default: false
        type: boolean
      ref:
        description: "要构建的 git ref（分支 / tag / commit）；留空则使用触发 workflow 的 ref"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve build matrix
        id: plan
        shell: bash
        env:
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          matrix=$(jq -c --argjson nightly "${NIGHTLY}" '
            {platform: (.server_linux | if $nightly then map(select(.nightly == true)) else . end)}
          ' .github/build-matrix.json)
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "server_linux: $(jq '.platform | length' <<< "${matrix}") target(s)"

  build-linux-server:
    name: Build Server - ${{ matrix.platform.release_for }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: release-linux-${{ matrix.platform.target }}

      - name: Install cross
        env:
          CROSS_VERSION: v0.2.5
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${HOME}/.local/bin"
          gh release download "${CROSS_VERSION}" \
            --repo cross-rs/cross \
            --pattern cross-x86_64-unknown-linux-gnu.tar.gz \
            -O - \
            | tar -xz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build binary
        run: cross build --package nodeget-server --target ${{ matrix.platform.target }} --profile minimal --jobs 32
        env:
          CROSS_NO_WARNINGS: 0

      - name: Compress binary
        run: upx -9 ./target/${{ matrix.platform.target }}/minimal/nodeget-server

      - name: Rename binary
        run: cp target/${{ matrix.platform.target }}/minimal/nodeget-server target/${{ matrix.platform.target }}/minimal/${{ matrix.platform.binary_name }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/minimal/${{ matrix.platform.binary_name }}
          if-no-files-found: error
          retention-days: 14
