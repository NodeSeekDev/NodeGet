name: nightly

# 每日构建：从开发分支（dev）构建 nightly 版本，滚动更新名为 `nightly` 的预发布，
# 并推送 Docker 镜像的 `nightly` 标签。nightly 不保证稳定，普通用户请使用正式版。
#
# 定时任务只会运行默认分支（main）上的 workflow 文件，所以这里分两步：
#   1. 定时触发（或在 dev 以外的分支上手动触发）时，运行 `dispatch` 作业，它只负责到 dev 分支上触发本 workflow；
#   2. 真正的构建以 workflow_dispatch 的方式在 dev 分支上运行，检出的就是 dev 自己的提交，
#      缓存也隔离在 dev 分支，不会被 main 上的正式发布读到。
# 构建过程中不检出任何由参数传入的 ref。手动触发时「Use workflow from」选哪个分支都可以，非 dev 会自动转到 dev。

on:
  schedule:
    # UTC 18:00，即北京时间次日 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      skip_if_unchanged:
        description: "dev 自上次 nightly 以来没有新提交时跳过（定时触发会自动带上；手动触发默认总是构建）"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 定时触发（在 main 上），或手动触发时选的不是 dev：转到 dev 分支上触发真正的 nightly 构建。
  # 定时触发总是带上"没有新提交就跳过"；手动触发沿用手动填的选项（默认总是构建）
  dispatch:
    name: Trigger nightly on dev
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly on the dev branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SKIP_IF_UNCHANGED: ${{ github.event_name == 'schedule' || inputs.skip_if_unchanged }}
        run: gh workflow run nightly.yml --repo "${REPO}" --ref dev -f skip_if_unchanged="${SKIP_IF_UNCHANGED}"

  # 只在 dev 分支上运行的手动触发才会真正构建
  check:
    name: Check for new commits
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version_suffix: ${{ steps.check.outputs.version_suffix }}
    steps:
      - name: Decide whether to build
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SKIP_IF_UNCHANGED: ${{ inputs.skip_if_unchanged }}
        run: |
          last=$(gh api "repos/${REPO}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)

          build="true"
          if [[ "${SKIP_IF_UNCHANGED}" == "true" && "${GITHUB_SHA}" == "${last}" ]]; then
            build="false"
            echo "No new commits on dev since the last nightly (${GITHUB_SHA}), skipping."
          fi

          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          # 版本号后缀带构建当天的日期（UTC），如 0.6.0-nightly.20261011
          echo "version_suffix=nightly.$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

  # 构建 .github/build-matrix.json 中的全部平台，和正式发布一致，这样脚本在所有平台都能安装 nightly
  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version_suffix: ${{ needs.check.outputs.version_suffix }}

  # Linux server 单独构建，nightly 镜像只依赖它
  build-server-linux:
    name: Build Linux server
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build-server-linux.yml
    with:
      version_suffix: ${{ needs.check.outputs.version_suffix }}

  publish-release:
    name: Publish nightly Release
    needs:
      - check
      - build-server-linux
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 只下载构建出的二进制（server-* / agent-*），不要把同一次运行里其他产物
      # （比如 Docker 构建生成的 *.dockerbuild 记录）一起发布到 Release
      - name: Download server binaries
        uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true

      # 把 nightly tag 移动到本次构建的提交，否则 tag 会停留在上一次的提交上
      - name: Move nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh api "repos/${REPO}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/nightly" -f sha="${SHA}" -F force=true
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/nightly" -f sha="${SHA}"
          fi

      # 发布日志 = 固定说明 + 自上一个正式版以来合并的 PR 列表。
      # nightly tag 每天移动、不是版本号，GitHub 找不到"上一个版本"，所以要明确指定起点：最新的正式版。
      # 必须放在 "Move nightly tag" 之后，这样 nightly 才指向本次构建的提交。
      # 生成失败（例如还没有正式版）不应该影响 nightly 发布，此时只保留固定说明。
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          自动构建的 nightly 版本，来自开发分支提交 \`${SHA}\`。
          **不保证稳定，普通用户请使用正式版。**

          安装 / 升级方式见文档「自动化脚本安装」中的预发布与 nightly 一节。
          EOF

          if previous=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name) && [[ -n "${previous}" ]]; then
            if notes=$(gh api -X POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name=nightly -f previous_tag_name="${previous}" --jq .body); then
              printf '\n---\n\n**相对 %s 的变更**\n\n%s\n' "${previous}" "${notes}" >> release-notes.md
            else
              echo "Failed to generate release notes, keeping the fixed text only." >&2
            fi
          else
            echo "No stable release found, keeping the fixed text only." >&2
          fi

      # 构建日期取自版本号后缀（如 nightly.20261012），和二进制里的版本号保持一致
      - name: Resolve build date
        id: date
        shell: bash
        env:
          VERSION_SUFFIX: ${{ needs.check.outputs.version_suffix }}
        run: |
          d="${VERSION_SUFFIX#nightly.}"
          echo "date=${d:0:4}-${d:4:2}-${d:6:2}" >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: NodeGet Nightly ${{ steps.date.outputs.date }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: dist/*

      # nightly 每天更新的是同一个 Release，而 GitHub 的"发布时间"只在发布时记录一次，
      # 页面上会一直显示第一次发布的日期。把 Release 先切成草稿再立刻发布回来，发布时间就会刷新为现在。
      # tag 和文件都不受影响；草稿期间只有几秒钟按 tag 查不到这个 Release。
      # 切成草稿失败时 Release 仍是发布状态，不用处理；但发布回来必须成功，否则 nightly 会一直是草稿，所以重试几次。
      - name: Refresh release date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=true --silent
          for attempt in 1 2 3 4 5; do
            if gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true -f make_latest=false --silent; then
              exit 0
            fi
            echo "Failed to publish the release again (attempt ${attempt}), retrying." >&2
            sleep 5
          done
          echo "::error::The nightly release is stuck as a draft, publish it manually." >&2
          exit 1

  # 只等 Linux server 构建，不受其他平台构建结果影响，也不影响 nightly Release 的发布；不更新 latest
  publish-docker-server:
    name: Publish Docker image
    needs:
      - check
      - build-server-linux
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: nightly
      latest: false
    secrets: inherit
