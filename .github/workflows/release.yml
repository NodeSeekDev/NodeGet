name: release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update the GitHub Release and Docker image"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          publish="false"
          tag=""

          # push tag 触发 → 自动发布；手动触发 → 读取 inputs
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish="true"
            tag="${GITHUB_REF_NAME}"
          else
            publish="${{ inputs.publish_release }}"
            # 从 Cargo.toml workspace.package.version 读取版本号，加上 v 前缀
            version=$(awk '/^\[workspace\.package\]/{found=1; next} found && /^version/{sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*/, ""); print; exit}' Cargo.toml)
            tag="v${version}"
          fi

          # 发布时校验 tag 格式：v + 语义版本，允许 pre-release 后缀如 -rc1, +build123
          if [[ "${publish}" == "true" ]]; then
            if [[ ! "${tag}" =~ ^v[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "release_tag must look like v0.3.7 when publishing, got: ${tag}" >&2
              exit 1
            fi
          fi

          # tag 带 pre-release 后缀（如 v0.6.1-rc.1、v0.6.1-beta.1）即为预发布：
          # 不标记为 Latest，也不覆盖 Docker 的 latest 标签
          prerelease="false"
          if [[ "${tag}" =~ ^v[0-9.]+- ]]; then
            prerelease="true"
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  # 全平台构建，target 列表见 .github/build-matrix.json
  # Linux server 单独构建，Docker 镜像只依赖它；其余平台（agent、Windows、macOS server）在 build 里
  build-server-linux:
    name: Build Linux server
    needs: prepare
    uses: ./.github/workflows/build-server-linux.yml

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-server-linux
      - build
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NodeGet ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          files: dist/*

  # 只等 Linux server 构建，不受 agent / Windows / macOS 构建结果影响，也不影响 GitHub Release 的发布
  publish-docker-server:
    name: Publish Docker image
    needs:
      - prepare
      - build-server-linux
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
    secrets: inherit
